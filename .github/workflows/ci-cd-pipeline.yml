name: QuickChat CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:  # Allow manual trigger

jobs:
  # Job 1: Build and Test
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: 'maven'
      
      - name: Build with Maven
        run: mvn clean compile
      
      - name: Run tests
        run: mvn test
      
      - name: Generate test report
        run: mvn surefire:report
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: target/surefire-reports/
      
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: target/site/jacoco/
      
      - name: Package application
        run: mvn package -DskipTests
      
      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: quickchat-jar
          path: target/*.jar

  # Job 2: Code Quality
  code-quality:
    name: Code Quality Check
    runs-on: ubuntu-latest
    needs: build
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
      
      - name: Run Checkstyle
        run: |
          cat > checkstyle.xml << 'EOF'
          <?xml version="1.0"?>
          <!DOCTYPE module PUBLIC "-//Checkstyle//DTD Checkstyle Configuration 1.3//EN" 
          "https://checkstyle.org/dtds/configuration_1_3.dtd">
          <module name="Checker">
              <module name="TreeWalker">
                  <module name="Indentation">
                      <property name="basicOffset" value="4"/>
                      <property name="braceAdjustment" value="0"/>
                  </module>
                  <module name="LineLength">
                      <property name="max" value="120"/>
                  </module>
                  <module name="AvoidStarImport"/>
                  <module name="UnusedImports"/>
              </module>
          </module>
          EOF
          mvn checkstyle:check || true
        continue-on-error: true
  
  # Job 3: Security Scan
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Run Security Scanner
        uses: github/codeql-action/init@v3
        with:
          languages: java
      
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  # Job 4: Cross-Platform Test
  cross-platform:
    name: Cross-Platform Test
    runs-on: ${{ matrix.os }}
    needs: build
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
      
      - name: Run tests on ${{ matrix.os }}
        run: mvn clean test

  # Job 5: Build Docker Image
  docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [build, code-quality, security]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: quickchat-jar
          path: target/
      
      - name: Create Dockerfile
        run: |
          cat > Dockerfile << 'EOF'
          FROM eclipse-temurin:11-jre-alpine
          WORKDIR /app
          COPY target/*.jar app.jar
          RUN addgroup -S quickchat && adduser -S quickchat -G quickchat
          USER quickchat:quickchat
          ENTRYPOINT ["java", "-jar", "app.jar"]
          EOF
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: quickchat:latest
      
      - name: Test Docker image
        run: |
          docker run --rm quickchat:latest java -version

  # Job 6: Deployment
  deploy:
    name: Deploy to GitHub Releases
    runs-on: ubuntu-latest
    needs: [build, cross-platform, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: quickchat-jar
          path: target/
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Release v1.0.${{ github.run_number }}
          body: |
            ## QuickChat Release v1.0.${{ github.run_number }}
            
            ### Features
            - Automated build and test pipeline
            - Multi-platform support
            - Docker containerization
            
            ### Installation
            Download the JAR file and run:
            ```bash
            java -jar poe-part-1-1.0-SNAPSHOT.jar
