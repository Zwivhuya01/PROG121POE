name: Java CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # Manual trigger

env:
  JAVA_VERSION: '17'
  PROJECT_NAME: 'QuickChat-POE'

jobs:
  # Job 1: Build and Test
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'
      
      - name: Cache Maven dependencies
        uses: actions/cache@v3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2
      
      - name: Compile Java files
        run: |
          mkdir -p target/classes
          javac -d target/classes $(find . -name "*.java")
      
      - name: Create JAR file
        run: |
          echo "Main-Class: poe.part_1.Part_1" > manifest.txt
          jar cfm target/${{ env.PROJECT_NAME }}.jar manifest.txt -C target/classes .
      
      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PROJECT_NAME }}-jar
          path: target/${{ env.PROJECT_NAME }}.jar
          retention-days: 7
      
      - name: Run application test (dry run)
        run: |
          java -cp target/classes poe.part_1.Part_1 << EOF
          test
          user
          user_123
          Pass@1234
          +27791234567
          testuser
          Pass@1234
          0
          EOF
        continue-on-error: true

  # Job 2: Code Quality Check
  code-quality:
    runs-on: ubuntu-latest
    needs: build-and-test
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
      
      - name: Run SpotBugs (Static Analysis)
        run: |
          wget -O spotbugs.zip https://github.com/spotbugs/spotbugs/releases/download/4.8.3/spotbugs-4.8.3.zip
          unzip spotbugs.zip
          ./spotbugs-4.8.3/bin/spotbugs -textui -high -exitCode -effort:max \
            $(find . -name "*.java")
        continue-on-error: true
      
      - name: Check for common code smells
        run: |
          # Check for System.out.println in production (warn only)
          echo "=== Code Quality Report ==="
          echo "System.out.println usage:"
          grep -rn "System.out.println" --include="*.java" . | wc -l
          echo "TODO comments:"
          grep -rn "TODO" --include="*.java" . | wc -l
          echo "========================"

  # Job 3: Create Release
  create-release:
    runs-on: ubuntu-latest
    needs: [build-and-test, code-quality]
    if: github.ref == 'refs/heads/main'
    
    steps:
      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.PROJECT_NAME }}-jar
          path: target/
      
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ github.run_number }}
          name: Release v${{ github.run_number }}
          body: |
            ## QuickChat POE Application Release v${{ github.run_number }}
            
            ### Changes in this release:
            - Automated build from commit ${{ github.sha }}
            
            ### Features:
            - User Registration with validation
            - Secure Login system
            - Message creation and storage
            - JSON export functionality
            
            ### Installation:
            1. Download the JAR file
            2. Run: `java -jar QuickChat-POE.jar`
            
            ### Requirements:
            - Java 17 or higher
          files: |
            target/${{ env.PROJECT_NAME }}.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Job 4: Docker Build and Push
  docker-build:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.PROJECT_NAME }}-jar
          path: target/
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/quickchat-poe:latest
            ${{ secrets.DOCKER_USERNAME }}/quickchat-poe:${{ github.run_number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max