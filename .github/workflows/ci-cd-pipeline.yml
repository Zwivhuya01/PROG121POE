name: Java CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: List files for debugging
      run: |
        echo "Current directory: $(pwd)"
        echo "Files in root:"
        ls -la
        echo "Looking for pom.xml:"
        find . -name "pom.xml" -type f
    
    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: maven
    
    - name: Cache Maven dependencies
      uses: actions/cache@v3
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2
    
    - name: Build with Maven
      run: mvn clean compile
      # Don't specify -f flag - let Maven find pom.xml automatically
    
    - name: Run tests
      run: mvn test
    
    - name: Package application
      run: mvn package -DskipTests
    
    - name: List target directory
      run: ls -la target/ || echo "Target directory not found"
    
    - name: Upload JAR artifact
      uses: actions/upload-artifact@v4
      with:
        name: poe-part-1-jar
        path: target/*.jar
        retention-days: 7

  code-quality:
    runs-on: ubuntu-latest
    needs: build-and-test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
    
    - name: Verify Java files structure
      run: |
        echo "Checking Java source files..."
        find src/main/java -name "*.java" -type f
        echo " Source files found"
        
        # Verify main class exists
        if [ ! -f "src/main/java/poe/part_1/Part_1.java" ]; then
          echo "::error::Main class Part_1.java not found"
          exit 1
        fi
        echo " Main class verified"
    
    - name: Check for compilation errors
      run: |
        mvn clean compile 2>&1 | tee compile.log
        if grep -q "ERROR" compile.log; then
          echo "::error::Compilation errors found"
          exit 1
        fi
        echo " No compilation errors"

  create-release:
    runs-on: ubuntu-latest
    needs: [build-and-test, code-quality]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Download JAR artifact
      uses: actions/download-artifact@v4
      with:
        name: poe-part-1-jar
        path: target/
    
    - name: Get version from pom.xml
      id: get_version
      run: |
        if [ -f "pom.xml" ]; then
          VERSION=$(grep -oPm1 "(?<=<version>)[^<]+" pom.xml)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Found version: $VERSION"
        else
          echo "version=1.0.0" >> $GITHUB_OUTPUT
          echo "Using default version: 1.0.0"
        fi
    
    - name: List JAR files
      run: ls -la target/
    
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v${{ steps.get_version.outputs.version }}-${{ github.run_number }}
        name: Release v${{ steps.get_version.outputs.version }}
        body: |
          ## QuickChat Application Release
          
          ### Features:
          - User registration and login system
          - Message creation with validation
          - Message storage in JSON format
          - Message hash generation
          
          ### Installation:
          1. Download the JAR file below
          2. Run: `java -jar poe-part-1-*.jar`
          
          ### Requirements:
          - Java 11 or higher
          
          ### Build Information:
          - Build #: ${{ github.run_number }}
          - Commit: ${{ github.sha }}
        files: |
          target/*.jar
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notification:
    runs-on: ubuntu-latest
    needs: [build-and-test, code-quality]
    if: always()
    steps:
    - name: Check build status
      run: |
        echo "========================================="
        echo "Build Status Summary"
        echo "========================================="
        echo "Build and Test: ${{ needs.build-and-test.result }}"
        echo "Code Quality: ${{ needs.code-quality.result }}"
        echo "========================================="
        
        if [ "${{ needs.build-and-test.result }}" == "success" ]; then
          echo " Build successful!"
          exit 0
        else
          echo "Build failed"
          exit 1
        fi