name: Java CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Debug - List all files
      run: |
        echo "Current directory: $(pwd)"
        echo "All files in repository:"
        ls -la
        echo ""
        echo "Searching for pom.xml files:"
        find . -name "pom.xml" -type f
        echo ""
        echo "Directory structure:"
        find . -type d -maxdepth 3
    
    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
    
    - name: Build with Maven (try root)
      id: build_root
      continue-on-error: true
      run: |
        mvn clean compile
      working-directory: .
    
    - name: Build with Maven (try src directory)
      id: build_src
      continue-on-error: true
      if: steps.build_root.outcome == 'failure'
      run: |
        mvn clean compile
      working-directory: ./src
    
    - name: Build with Maven (try java directory)
      id: build_java
      continue-on-error: true
      if: steps.build_src.outcome == 'failure'
      run: |
        mvn clean compile
      working-directory: ./src/main/java
    
    - name: Check if pom.xml exists in root
      run: |
        if [ -f "pom.xml" ]; then
          echo "pom.xml found in root"
          echo "POM_EXISTS=true" >> $GITHUB_ENV
        else
          echo "pom.xml NOT found in root"
          echo "POM_EXISTS=false" >> $GITHUB_ENV
          echo ""
          echo "Please ensure pom.xml is committed to the repository root."
          echo "To fix this, run these commands locally:"
          echo "  git add pom.xml"
          echo "  git commit -m 'Add pom.xml'"
          echo "  git push"
        fi
      working-directory: .
    
    - name: Create pom.xml if missing
      if: env.POM_EXISTS == 'false'
      run: |
        cat > pom.xml << 'EOF'
        <?xml version="1.0" encoding="UTF-8"?>
        <project xmlns="http://maven.apache.org/POM/4.0.0"
                 xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                 xsi:schemaLocation="http://maven.apache.org/POM/4.0.0 
                 http://maven.apache.org/xsd/maven-4.0.0.xsd">
            <modelVersion>4.0.0</modelVersion>
            <groupId>poe</groupId>
            <artifactId>poe-part-1</artifactId>
            <version>1.0-SNAPSHOT</version>
            <packaging>jar</packaging>
            
            <properties>
                <maven.compiler.source>11</maven.compiler.source>
                <maven.compiler.target>11</maven.compiler.target>
                <project.build.sourceEncoding>UTF-8</project.build.sourceEncoding>
            </properties>
            
            <dependencies>
                <dependency>
                    <groupId>org.json</groupId>
                    <artifactId>json</artifactId>
                    <version>20230227</version>
                </dependency>
                
                <dependency>
                    <groupId>org.junit.jupiter</groupId>
                    <artifactId>junit-jupiter-api</artifactId>
                    <version>5.9.2</version>
                    <scope>test</scope>
                </dependency>
                <dependency>
                    <groupId>org.junit.jupiter</groupId>
                    <artifactId>junit-jupiter-engine</artifactId>
                    <version>5.9.2</version>
                    <scope>test</scope>
                </dependency>
            </dependencies>
            
            <build>
                <plugins>
                    <plugin>
                        <groupId>org.apache.maven.plugins</groupId>
                        <artifactId>maven-surefire-plugin</artifactId>
                        <version>3.0.0-M9</version>
                    </plugin>
                    <plugin>
                        <groupId>org.apache.maven.plugins</groupId>
                        <artifactId>maven-compiler-plugin</artifactId>
                        <version>3.11.0</version>
                    </plugin>
                </plugins>
            </build>
        </project>
        EOF
        echo "Created pom.xml in root directory"
      working-directory: .
    
    - name: Build with Maven (final attempt)
      run: |
        mvn clean compile
      working-directory: .
    
    - name: Run tests
      run: |
        mvn test
      working-directory: .
    
    - name: Package application
      run: |
        mvn package -DskipTests
      working-directory: .
    
    - name: List target directory
      run: |
        ls -la target/ || echo "Target directory not found"
      working-directory: .
    
    - name: Upload JAR artifact
      uses: actions/upload-artifact@v4
      with:
        name: poe-part-1-jar
        path: target/*.jar
        retention-days: 7

  code-quality:
    runs-on: ubuntu-latest
    needs: build-and-test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
    
    - name: Create pom.xml if missing
      run: |
        if [ ! -f "pom.xml" ]; then
          cat > pom.xml << 'EOF'
        <?xml version="1.0" encoding="UTF-8"?>
        <project xmlns="http://maven.apache.org/POM/4.0.0"
                 xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                 xsi:schemaLocation="http://maven.apache.org/POM/4.0.0 
                 http://maven.apache.org/xsd/maven-4.0.0.xsd">
            <modelVersion>4.0.0</modelVersion>
            <groupId>poe</groupId>
            <artifactId>poe-part-1</artifactId>
            <version>1.0-SNAPSHOT</version>
            <packaging>jar</packaging>
            
            <properties>
                <maven.compiler.source>11</maven.compiler.source>
                <maven.compiler.target>11</maven.compiler.target>
                <project.build.sourceEncoding>UTF-8</project.build.sourceEncoding>
            </properties>
            
            <dependencies>
                <dependency>
                    <groupId>org.json</groupId>
                    <artifactId>json</artifactId>
                    <version>20230227</version>
                </dependency>
            </dependencies>
        </project>
        EOF
          echo "Created pom.xml"
        fi
    
    - name: Verify Java files structure
      run: |
        echo "Checking Java source files..."
        find src -name "*.java" -type f 2>/dev/null || echo "No Java files found"
        echo "Source check completed"
    
    - name: Compile Java files directly (alternative)
      run: |
        echo "Attempting direct compilation..."
        mkdir -p target/classes
        find src -name "*.java" > sources.txt
        if [ -s sources.txt ]; then
          javac -d target/classes -cp ".:lib/*:target/classes" @sources.txt 2>&1 || echo "Compilation had issues"
          echo " Direct compilation attempted"
        else
          echo " No Java source files found"
        fi

  simple-build:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: always()
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
    
    - name: Download JSON library
      run: |
        mkdir -p lib
        wget -P lib/ https://repo1.maven.org/maven2/org/json/json/20230227/json-20230227.jar
        echo " Downloaded JSON library"
    
    - name: Compile Java files
      run: |
        mkdir -p target/classes
        echo "Compiling Java files..."
        javac -cp "lib/*" -d target/classes $(find src/main/java -name "*.java")
        echo " Compilation successful"
    
    - name: Create JAR file
      run: |
        jar cvfe target/poe-part-1.jar poe.part_1.Part_1 -C target/classes .
        echo " JAR file created"
    
    - name: Upload JAR artifact
      uses: actions/upload-artifact@v4
      with:
        name: poe-part-1-simple-jar
        path: target/*.jar
        retention-days: 7